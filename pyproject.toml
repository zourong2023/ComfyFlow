[project]
name = "comfyflow"
version = "0.1.0"
description = "ComfyUI Conditioning Cache Pipeline + Web Panel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "gradio>=4.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/ComfyFlow"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["comfyflow", "comfyflow.adapters"]
